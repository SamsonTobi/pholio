name = "realtime"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[durable_objects]
bindings = [
  { name = "REALTIME_ROOM", class_name = "RealtimeRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeRoom"]

# NOTE: no [vars] defaults here on purpose. Set non-secret config per env:
#   [env.production]
#   vars = { APP_URL = "https://your-prod-domain" }
# Secrets (never commit): wrangler secret put FANOUT_SECRET
# For preview/dev: wrangler secret put FANOUT_SECRET --env dev

[env.production]
vars = { APP_URL = "https://pholio.cc" }
